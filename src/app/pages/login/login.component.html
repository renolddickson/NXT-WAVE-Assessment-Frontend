<div class="min-h-screen bg-stone-50 flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-sm">
    <div class="bg-white border border-slate-200 rounded-md p-6">
      <h1 class="text-xl font-semibold text-slate-900 mb-6">Login</h1>

      <div *ngIf="errorMessage()" class="mb-4 bg-red-50 border border-red-200 p-3 rounded" role="alert">
        <p class="text-sm text-red-700">{{ errorMessage() }}</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input id="email"
                 type="email"
                 formControlName="email"
                 class="block w-full px-3 py-2 border border-slate-300 rounded-md text-sm placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-slate-900 focus:border-slate-900"
                 [ngClass]="{'border-red-500': loginForm.get('email')?.touched && loginForm.get('email')?.invalid}"
                 placeholder="admin@tracker.com">
          <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="mt-1 text-xs text-red-600">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Enter a valid email.</span>
          </div>
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input id="password"
                 type="password"
                 formControlName="password"
                 class="block w-full px-3 py-2 border border-slate-300 rounded-md text-sm placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-slate-900 focus:border-slate-900"
                 [ngClass]="{'border-red-500': loginForm.get('password')?.touched && loginForm.get('password')?.invalid}"
                 placeholder="Password">
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="mt-1 text-xs text-red-600">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</span>
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 4 characters.</span>
          </div>
        </div>

        <button type="submit"
                [disabled]="isLoading()"
                class="w-full py-2 px-4 rounded-md text-sm font-medium text-white bg-slate-900 hover:bg-slate-800 disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer">
          {{ isLoading() ? 'Logging in...' : 'Login' }}
        </button>
      </form>

      <a routerLink="/register" class="block mt-4 text-sm text-slate-700 underline underline-offset-4">
        Create account
      </a>
    </div>
  </div>
</div>
