<div class="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50 transition-opacity">
  <div class="bg-white rounded-md border border-slate-200 shadow-xl max-w-lg w-full overflow-hidden flex flex-col transform transition-all duration-300 scale-100">
    <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
      <h3 class="text-base font-semibold text-slate-900">
        {{ task ? 'Edit Task' : 'Create Task' }}
      </h3>
      <button (click)="close.emit()" class="text-slate-400 hover:text-slate-600 focus:outline-none cursor-pointer">
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div *ngIf="errorMessage()" class="m-6 mb-0 bg-red-50 border-l-4 border-red-500 p-4 rounded" role="alert">
      <p class="text-xs text-red-700 font-medium">{{ errorMessage() }}</p>
    </div>

    <form [formGroup]="taskForm" (ngSubmit)="onSubmit()" class="flex-1 overflow-y-auto px-6 py-4 space-y-4">
      <div>
        <label for="title" class="block text-xs font-semibold text-slate-700">
          Task title
        </label>
        <input type="text" id="title" formControlName="title"
               class="mt-1.5 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm text-sm focus:outline-none focus:ring-slate-900 focus:border-slate-900"
               [ngClass]="{'border-red-500 ring-red-500': taskForm.get('title')?.touched && taskForm.get('title')?.invalid}"
               placeholder="Enter descriptive title">
        <div *ngIf="taskForm.get('title')?.touched && taskForm.get('title')?.invalid" class="mt-1 text-xs text-red-600">
          <span *ngIf="taskForm.get('title')?.errors?.['required']">Title is required.</span>
          <span *ngIf="taskForm.get('title')?.errors?.['maxlength']">Title cannot exceed 200 characters.</span>
        </div>
      </div>

      <div>
        <label for="description" class="block text-xs font-semibold text-slate-700">
          Description
        </label>
        <textarea id="description" formControlName="description" rows="3"
                  class="mt-1.5 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm text-sm focus:outline-none focus:ring-slate-900 focus:border-slate-900"
                  placeholder="Add the task details"></textarea>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="assignee" class="block text-xs font-semibold text-slate-700">
            Assignee
          </label>
          <select id="assignee" formControlName="assignee"
                  class="mt-1.5 block w-full px-3 py-2 border border-slate-300 rounded-md bg-white shadow-sm text-sm focus:outline-none focus:ring-slate-900 focus:border-slate-900"
                  [ngClass]="{'border-red-500 ring-red-500': taskForm.get('assignee')?.touched && taskForm.get('assignee')?.invalid}">
            <option value="" disabled>Select User</option>
            <option *ngFor="let user of users()" [value]="user.id">
              {{ user.name }} ({{ user.role }})
            </option>
          </select>
          <div *ngIf="taskForm.get('assignee')?.touched && taskForm.get('assignee')?.invalid" class="mt-1 text-xs text-red-600">
            Assignee is required.
          </div>
        </div>

        <div>
          <label for="projectId" class="block text-xs font-semibold text-slate-700">
            Project
          </label>
          <select id="projectId" formControlName="projectId"
                  class="mt-1.5 block w-full px-3 py-2 border border-slate-300 rounded-md bg-white shadow-sm text-sm focus:outline-none focus:ring-slate-900 focus:border-slate-900">
            <option value="">No Project / Independent</option>
            <option *ngFor="let proj of projects()" [value]="proj.id">
              {{ proj.name }}
            </option>
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="priority" class="block text-xs font-semibold text-slate-700">
            Priority
          </label>
          <select id="priority" formControlName="priority"
                  class="mt-1.5 block w-full px-3 py-2 border border-slate-300 rounded-md bg-white shadow-sm text-sm focus:outline-none focus:ring-slate-900 focus:border-slate-900">
            <option value="LOW">Low</option>
            <option value="MEDIUM">Medium</option>
            <option value="HIGH">High</option>
          </select>
        </div>

        <div>
          <label for="due_date" class="block text-xs font-semibold text-slate-700">
            Due date
          </label>
          <input type="date" id="due_date" formControlName="due_date"
                 class="mt-1.5 block w-full px-3 py-2 border border-slate-300 rounded-md shadow-sm text-sm focus:outline-none focus:ring-slate-900 focus:border-slate-900"
                 [ngClass]="{'border-red-500 ring-red-500': taskForm.get('due_date')?.touched && taskForm.get('due_date')?.invalid}">
          <div *ngIf="taskForm.get('due_date')?.touched && taskForm.get('due_date')?.invalid" class="mt-1 text-xs text-red-600">
            <span *ngIf="taskForm.get('due_date')?.errors?.['required']">Due Date is required.</span>
            <span *ngIf="taskForm.get('due_date')?.errors?.['notFuture']">Due Date must be in the future.</span>
          </div>
        </div>
      </div>

      <div class="pt-4 border-t border-slate-100 flex justify-end space-x-3">
        <button type="button" (click)="close.emit()" [disabled]="isLoading()"
                class="px-4 py-2 border border-slate-200 text-sm font-medium rounded-md text-slate-700 bg-white hover:bg-slate-50 transition-colors disabled:opacity-50 cursor-pointer">
          Cancel
        </button>
        <button type="submit" [disabled]="isLoading()"
                class="px-4 py-2 border border-transparent rounded-md text-sm font-medium text-white bg-slate-900 hover:bg-slate-800 transition-colors disabled:opacity-50 cursor-pointer flex items-center">
          <svg *ngIf="isLoading()" class="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Save Task
        </button>
      </div>
    </form>
  </div>
</div>
