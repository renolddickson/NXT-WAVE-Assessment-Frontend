<div class="min-h-screen flex bg-slate-50 font-sans">
  <!-- Left Side: Premium Dark Sidebar -->
  <aside class="w-64 bg-[#0f172a] shrink-0 flex flex-col justify-between border-r border-slate-800 text-slate-300">
    <!-- Top Brand & Navigation -->
    <div class="p-5 flex-1 flex flex-col">
      <!-- Brand Logo -->
      <div class="flex items-center space-x-3 mb-8">
        <div class="h-9 w-9 bg-blue-600 rounded-lg flex items-center justify-center text-white font-extrabold text-lg shadow-md shrink-0">
          T
        </div>
        <div>
          <span class="block font-semibold text-white text-sm leading-tight">Team Task</span>
          <span class="block text-xxs text-slate-400 font-medium mt-0.5">{{ currentUser()?.organizationName || 'Demo Organization' }}</span>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="space-y-1.5 flex-1">
        <a routerLink="/dashboard" 
           routerLinkActive="bg-blue-600 text-white font-medium" 
           [routerLinkActiveOptions]="{ exact: true }"
           class="flex items-center space-x-3 px-3.5 py-2.5 rounded-md text-xs font-semibold hover:text-white hover:bg-slate-800 transition-all cursor-pointer">
          <svg class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z" />
          </svg>
          <span>Dashboard</span>
        </a>

        <a routerLink="/projects" 
           routerLinkActive="bg-blue-600 text-white font-medium"
           class="flex items-center space-x-3 px-3.5 py-2.5 rounded-md text-xs font-semibold hover:text-white hover:bg-slate-800 transition-all cursor-pointer">
          <svg class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
          </svg>
          <span>Projects</span>
        </a>

        <a *ngIf="isAdmin()"
           routerLink="/users" 
           routerLinkActive="bg-blue-600 text-white font-medium"
           class="flex items-center space-x-3 px-3.5 py-2.5 rounded-md text-xs font-semibold hover:text-white hover:bg-slate-800 transition-all cursor-pointer">
          <svg class="h-4.5 w-4.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <span>Users</span>
        </a>
      </nav>
    </div>

    <!-- Bottom Profile Panel -->
    <div class="p-4 border-t border-slate-800 bg-[#0b1329] flex items-center justify-between" *ngIf="currentUser()">
      <div class="flex items-center space-x-3 min-w-0">
        <div class="h-8 w-8 rounded-full bg-slate-700 border border-slate-600 text-white flex items-center justify-center font-bold text-xs shrink-0">
          {{ currentUser()?.name?.charAt(0) }}
        </div>
        <div class="min-w-0">
          <div class="text-xs font-bold text-white truncate">{{ currentUser()?.name }}</div>
          <div class="text-[10px] font-semibold text-emerald-500 uppercase tracking-wide mt-0.5">{{ currentUser()?.role }}</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Right Side: Top Header + Dynamic Viewport -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Top Header -->
    <header class="bg-white border-b border-slate-200 h-16 shrink-0 sticky top-0 z-30 flex items-center justify-between px-6">
      <div class="flex items-center">
        <h2 class="text-base font-bold text-slate-800">Task board</h2>
      </div>

      <!-- Header actions (notification + logout) -->
      <div class="flex items-center space-x-3">
        <!-- Notification icon -->
        <button class="text-slate-400 hover:text-slate-600 p-1.5 rounded-full hover:bg-slate-50 transition-colors focus:outline-none cursor-pointer">
          <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
        </button>

        <button (click)="logout()" 
                class="px-4 py-1.5 border border-slate-200 text-xs font-semibold rounded text-slate-700 bg-white hover:bg-slate-50 transition-all shadow-xxs focus:outline-none cursor-pointer">
          Logout
        </button>
      </div>
    </header>

    <!-- Content Viewport -->
    <main class="flex-1 overflow-y-auto p-6">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
