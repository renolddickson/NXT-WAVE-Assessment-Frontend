<div class="min-h-screen flex flex-col bg-stone-50 text-slate-900">
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-14 items-center">
        <div class="flex items-center space-x-3">
          <div class="h-8 w-8 bg-slate-900 rounded flex items-center justify-center text-white font-semibold text-sm">
            T
          </div>
          <div>
            <span class="font-semibold text-slate-900 text-sm tracking-tight">Team Task Tracker</span>
            <div class="text-xs text-slate-500 hidden sm:block">{{ currentUser()?.organizationName || 'Demo Organization' }}</div>
          </div>
        </div>

        <div class="flex items-center space-x-4" *ngIf="currentUser()">
          <div class="text-right hidden sm:block">
            <div class="text-sm font-medium text-slate-800">{{ currentUser()?.name }}</div>
            <div class="text-xs text-slate-500 flex items-center justify-end gap-1">
              <span class="inline-block h-1.5 w-1.5 rounded-full" 
                    [ngClass]="{
                      'bg-indigo-500': currentUser()?.role === 'ADMIN',
                      'bg-sky-500': currentUser()?.role === 'MANAGER',
                      'bg-emerald-500': currentUser()?.role === 'MEMBER'
                    }"></span>
              {{ currentUser()?.role }}
            </div>
          </div>
          <button (click)="logout()" 
                  class="inline-flex items-center justify-center px-3 py-1.5 border border-slate-200 text-xs font-medium rounded-md text-slate-700 bg-white hover:bg-slate-50 transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 cursor-pointer">
            Logout
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="flex flex-1 flex-col md:flex-row max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-5 gap-5">
    <aside class="w-full md:w-64 shrink-0">
      <nav class="flex md:flex-col flex-row gap-1 bg-white border border-slate-200 rounded-md p-2 overflow-x-auto md:overflow-x-visible">
        <a routerLink="/dashboard" 
           routerLinkActive="bg-slate-900 text-white font-medium" 
           [routerLinkActiveOptions]="{ exact: true }"
           class="flex items-center space-x-3 px-4 py-2.5 rounded-md text-sm text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all w-full min-w-[110px] md:min-w-0">
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2H6a2 2 0 01-2-2v-4zM14 16a2 2 0 012-2h2a2 2 0 012 2v4a2 2 0 01-2 2h-2a2 2 0 01-2-2v-4z" />
          </svg>
          <span>Dashboard</span>
        </a>

        <a routerLink="/projects" 
           routerLinkActive="bg-slate-900 text-white font-medium"
           class="flex items-center space-x-3 px-4 py-2.5 rounded-md text-sm text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all w-full min-w-[100px] md:min-w-0">
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
          </svg>
          <span>Projects</span>
        </a>

        <a *ngIf="isAdmin()"
           routerLink="/users" 
           routerLinkActive="bg-slate-900 text-white font-medium"
           class="flex items-center space-x-3 px-4 py-2.5 rounded-md text-sm text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-all w-full min-w-[90px] md:min-w-0">
          <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          <span>Users</span>
        </a>
      </nav>
    </aside>

    <main class="flex-1 min-w-0">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
