<div class="min-h-screen bg-slate-50 text-slate-900">
  <aside class="fixed inset-y-0 left-0 z-40 w-60 bg-slate-950 text-slate-300 border-r border-slate-800 flex flex-col">
    <div class="px-4 py-5 border-b border-slate-800/60 bg-slate-950">
      <div class="flex items-center gap-3">
        <div class="h-9 w-9 rounded-lg bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-md shadow-blue-500/20 shrink-0">
          <svg class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
        </div>
        <div class="min-w-0">
          <div class="text-sm font-bold text-white tracking-wide leading-tight">TaskTracker</div>
          <div class="text-[10px] text-slate-500 font-semibold uppercase tracking-wider truncate mt-0.5">
            {{ currentUser()?.organizationName || 'Workspace' }}
          </div>
        </div>
      </div>
    </div>

    <nav class="flex-1 px-3 py-5 space-y-1">
      <a routerLink="/dashboard"
         routerLinkActive="bg-blue-600 text-white"
         [routerLinkActiveOptions]="{ exact: true }"
         class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium hover:bg-slate-900 hover:text-white transition-colors">
        <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5h7v7H4V5zm9 0h7v7h-7V5zM4 14h7v5H4v-5zm9 0h7v5h-7v-5z" />
        </svg>
        <span>Dashboard</span>
      </a>

      <a routerLink="/projects"
         routerLinkActive="bg-blue-600 text-white"
         class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium hover:bg-slate-900 hover:text-white transition-colors">
        <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7a2 2 0 012-2h5l2 2h7a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" />
        </svg>
        <span>Projects</span>
      </a>

      <a *ngIf="isAdmin() || isManager()"
         routerLink="/analytics"
         routerLinkActive="bg-blue-600 text-white"
         class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium hover:bg-slate-900 hover:text-white transition-colors">
        <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
        </svg>
        <span>Analytics</span>
      </a>

      <a *ngIf="isAdmin()"
         routerLink="/users"
         routerLinkActive="bg-blue-600 text-white"
         class="flex items-center gap-3 px-3 py-2.5 rounded-md text-sm font-medium hover:bg-slate-900 hover:text-white transition-colors">
        <svg class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a4 4 0 00-4-4h-1M9 20H4v-2a4 4 0 014-4h1m0-4a4 4 0 100-8 4 4 0 000 8zm8 0a4 4 0 100-8 4 4 0 000 8z" />
        </svg>
        <span>Users</span>
      </a>
    </nav>

    <div class="px-4 py-4 border-t border-slate-800" *ngIf="currentUser()">
      <div class="flex items-center gap-3 min-w-0">
        <div class="h-9 w-9 rounded-md bg-slate-800 border border-slate-700 text-white flex items-center justify-center text-sm font-semibold shrink-0">
          {{ currentUser()?.name?.charAt(0) }}
        </div>
        <div class="min-w-0 flex-1">
          <div class="text-sm font-medium text-white truncate">{{ currentUser()?.name }}</div>
          <div class="text-xs text-emerald-400 font-medium">{{ currentUser()?.role }}</div>
        </div>
      </div>
    </div>
  </aside>

  <div class="min-h-screen ml-60">
    <header class="sticky top-0 z-30 h-16 bg-white/95 backdrop-blur-md border-b border-slate-200/80 flex items-center justify-between px-8">
      <h2 class="text-sm font-bold text-slate-900 tracking-tight">{{ pageTitle }}</h2>

      <div class="flex items-center gap-3">
        <button class="h-9 w-9 inline-flex items-center justify-center rounded-md text-slate-500 hover:bg-slate-100 hover:text-slate-700 transition-colors" aria-label="Notifications">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h11zm-5 4a2 2 0 004 0" />
          </svg>
        </button>

        <button (click)="logout()"
                class="px-4 py-2 border border-slate-200 text-sm font-medium rounded-md text-slate-700 bg-white hover:bg-slate-50 transition-colors">
          Logout
        </button>
      </div>
    </header>

    <main class="p-8">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
